worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream backend_pool {
        # Round Robin за замовчуванням
        server web1:8000 max_fails=3 fail_timeout=10s;
        server web2:8000 max_fails=3 fail_timeout=10s;
        # Для Least Connections:
        # least_conn;
        # Для IP Hash:
        # ip_hash;
        # Для Weighted:
        # server web1:8000 weight=3;
        # server web2:8000 weight=1;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймаути для health check
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Окремий endpoint для health check самого Nginx
        location /nginx-health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}